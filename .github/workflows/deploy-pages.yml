name: Deploy UI Showcase to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build clean UI showcase
        run: |
          python3 scripts/build_showcase.py --out dist

      - name: Verify showcase JS syntax
        run: |
          python3 -c "import re, subprocess, sys; html=open('dist/index.html', encoding='utf-8').read(); scripts=re.findall(r'<script>(.*?)</script>', html, re.DOTALL); [subprocess.run(['node', '--check'], input=s, text=True, check=True) for s in scripts]"

      - name: Verify zero character leaks
        run: |
          python3 -c "
          import os, sys
          forbidden = ['killua', 'kurapika', 'zoldyck', 'kurta', 'sk-hapuppy', 'hapuppy_key', 'jajanken']
          leaks = []
          for root, dirs, files in os.walk('dist'):
              for file in files:
                  path = os.path.join(root, file)
                  content = open(path, encoding='utf-8', errors='ignore').read().lower()
                  for word in forbidden:
                      if word in content:
                          leaks.append((path, word))
          if leaks:
              print('LEAKS DETECTED:', leaks)
              sys.exit(1)
          print('Zero leaks confirmed.')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
