# InfinityRoleplay — `docker compose up --build`, then open http://localhost:8777
services:
  app:
    build: .
    ports:
      - "8777:8777"
    environment:
      # Docker Desktop (Mac/Win): host Ollama via magic hostname.
      # Linux: needs `extra_hosts` below mapping host.docker.internal to the gateway.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DB_PATH=/data/infinity.db
      - HOST=0.0.0.0
      - CHAT_PORT=8777
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # OPTIONAL — run Ollama inside compose instead of on the host.
  # Users: `docker compose --profile ollama up --build`.
  # Then set OLLAMA_HOST=http://ollama:11434 for the app service.
  # Requires an NVIDIA GPU + nvidia-container-toolkit for real inference speed;
  # falls back to CPU (slow for 12b models) without `reservations`.
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ollama"]
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

volumes:
  ollama:
